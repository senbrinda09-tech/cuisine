<html>
<head>
<title> formulaire de candidature a un poste </title>

<body>
<h1> FORMULAIRE DE CANDIDATURE A UN POSTE </h1>
<br>
<h2> Veuillez remplir le formulaire. </h2>
<form action="traitement.php method="post">
<table border="0">
<tr>
<td> Nom</td>

<tr>
 <td> naissance </td>

</tr>
<tr>

     Femme : <input type="radio" name="sexe" value="F"> </td>

Sans emploi : <input type="radio" name="Sans emploi" value="Sans emploi"> <br>
Independant(e) : <input type="radio" name="Independant(e)" value="Independant(e)"> </td>
</tr>
<tr>
<td> Email </td>

</tr>
<br>
<tr>
<td> Tel </td>
<td> <input type="tel" name="telephone" placeholder="000000000"> </td>
</tr>
<tr>

<option value=" poste 1> poste 1 </option>
<option value=" poste 2> poste 2 </option>

</td>
</tr>
<input type="search" name="cv" placeholder="https://..."> 
<tr>

</tr>
</table>
</form>
</body>
</html>
